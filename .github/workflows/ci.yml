name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build-and-e2e:
    name: Build and Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kj/web build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @kj/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @kj/web test:e2e
        env:
          CI: true
          E2E_SKIP_A11Y: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  accessibility:
    name: Accessibility (axe, keyboard, reflow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Check the lines this PR adds (zoom, tabindex, focus outline, tiny text)
        if: github.event_name == 'pull_request'
        run: node scripts/check-a11y-diff.mjs origin/${{ github.base_ref }}
      - run: node --test "scripts/*.test.mjs"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kj/web build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @kj/web exec playwright install --with-deps chromium webkit
      - name: axe on every page (he + en), keyboard paths, reflow at 320px
        run: pnpm --filter @kj/web test:a11y
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: apps/web/playwright-report
          retention-days: 7

  migrations:
    name: Validate SQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: supabase/postgres:15.8.1.085
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "$f"
          done
          echo "== seed"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f supabase/seed.sql
      - name: Run SQL security/regression tests
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/tests/*.test.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "$f"
          done
